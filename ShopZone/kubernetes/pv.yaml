apiVersion: v1

kind: PersistentVolume


metadata:

  name: shopzone-pv


  labels:

    app: shopzone

    project: ecommerce



spec:


  capacity:

    storage: 5Gi



  accessModes:

    - ReadWriteOnce



  persistentVolumeReclaimPolicy:

    Retain



  storageClassName:

    manual



  hostPath:


    path: /data/shopzone


    type: DirectoryOrCreate
