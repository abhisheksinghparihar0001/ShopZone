apiVersion: networking.k8s.io/v1

kind: Ingress


metadata:

  name: shopzone-ingress

  namespace: shopzone


  labels:

    app: shopzone

    project: ecommerce



  annotations:

    nginx.ingress.kubernetes.io/rewrite-target: /



spec:


  ingressClassName: nginx



  rules:


  - host: shopzone.local


    http:


      paths:


      - path: /


        pathType: Prefix


        backend:


          service:


            name: shopzone-service


            port:


              number: 80
