apiVersion: v1

kind: ConfigMap


metadata:

  name: shopzone-config

  namespace: shopzone


  labels:

    app: shopzone

    project: ecommerce



data:


  APP_NAME: "ShopZone"


  APP_ENV: "production"


  APP_VERSION: "v1"


  SERVER_TYPE: "nginx"


  DEFAULT_LANGUAGE: "en"



  nginx.conf: |


    server {

        listen 80;


        server_name shopzone.local;


        root /usr/share/nginx/html;


        index index.html;


        location / {


            try_files $uri $uri/ /index.html;

        }


    }
