apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler


metadata:

  name: shopzone-hpa

  namespace: shopzone


  labels:

    app: shopzone

    project: ecommerce



spec:


  scaleTargetRef:


    apiVersion: apps/v1


    kind: Deployment


    name: shopzone



  minReplicas: 3


  maxReplicas: 10



  metrics:


  - type: Resource


    resource:


      name: cpu


      target:


        type: Utilization


        averageUtilization: 70




  - type: Resource


    resource:


      name: memory


      target:


        type: Utilization


        averageUtilization: 75



  behavior:


    scaleUp:


      stabilizationWindowSeconds: 60


      policies:


      - type: Percent


        value: 100


        periodSeconds: 60




    scaleDown:


      stabilizationWindowSeconds: 300


      policies:


      - type: Percent


        value: 50


        periodSeconds: 60
