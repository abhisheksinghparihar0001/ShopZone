apiVersion: apps/v1
kind: Deployment

metadata:
  name: shopzone
  namespace: shopzone

spec:

  replicas: 3


  selector:
    matchLabels:
      app: shopzone


  strategy:

    type: RollingUpdate

    rollingUpdate:

      maxUnavailable: 1

      maxSurge: 1



  template:

    metadata:

      labels:

        app: shopzone



    spec:


      containers:


      - name: shopzone


        image: shopzone:v1


        imagePullPolicy: IfNotPresent



        ports:


        - containerPort: 80



        resources:


          requests:

            cpu: "100m"

            memory: "128Mi"



          limits:

            cpu: "500m"

            memory: "512Mi"




        readinessProbe:


          httpGet:

            path: /

            port: 80


          initialDelaySeconds: 10

          periodSeconds: 5




        livenessProbe:


          httpGet:

            path: /

            port: 80


          initialDelaySeconds: 20

          periodSeconds: 10
